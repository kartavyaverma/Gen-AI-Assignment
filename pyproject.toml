[project]
name = "recipebot"
version = "0.1.0"
description = "A grounded recipe chatbot over the Recipe Box dataset (search, stats, pantry matching, substitutions)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[project.scripts]
recipebot-build = "recipebot.build_index:main"
recipebot-cli = "recipebot.cli:main"
recipebot-ui = "recipebot.ui:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
